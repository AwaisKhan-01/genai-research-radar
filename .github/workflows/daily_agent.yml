name: Daily AI Research Agent

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: 

jobs:
  run-agent:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 1. Create a pristine virtual environment and install dependencies inside it
      - name: Install Dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 2. Activate the virtual environment before running the agent
      - name: Run the AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          source .venv/bin/activate
          python agent.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Agent"
          git add reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated AI Research Digest" && git push)